<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meals</title>
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meals">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-left" id="topLeft"></div>
      <h1 id="title">Meals</h1>
      <div class="topbar-right" id="topRight"></div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Sections">
      <a href="#/ingredients" data-tab="ingredients">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.6 9.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8z"/><path d="M8.5 10 12 4l3.5 6"/><path d="M9.5 14v3M14.5 14v3"/></svg>
        <span>Ingredients</span>
      </a>
      <a href="#/meals" data-tab="meals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 8.5c0-1.4 1-1.8 1-3.2M12 8.5c0-1.4 1-1.8 1-3.2M16 8.5c0-1.4 1-1.8 1-3.2"/></svg>
        <span>Meals</span>
      </a>
      <a href="#/calendar" data-tab="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Calendar</span>
      </a>
    </nav>
  </div>

  <div id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <img src="/icon.svg" alt="" width="64" height="64">
      <h1>Meals</h1>
      <p class="muted">Enter your shared password</p>
      <input type="password" name="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" class="btn primary block">Sign in</button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
